name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    # 不做单元素 matrix —— 上报的 check 名须逐字为 `CI / verify`（DEFER-CI-001 的注册名）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Story 2.6 的 Tailwind v4 CLI 经 bun 由 exec-maven-plugin 调起（ADR 06）
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      # 规划断言（scripts/check-planning-docs.py）由 exec-maven-plugin 在 verify 相调起 ——
      # 这里只装工具链、不跑校验，唯一构建入口仍是下一步的 ./mvnw verify。
      # 显式钉版本而不吃 runner 预装的 python3：预装版本随镜像滚动，
      # 脚本的下限（3.11，与 CONTRIBUTING.md §1 的 Python 前置同源）就成了不可控项
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Maven verify
        run: ./mvnw -B verify

      # 失败时保留测试报告 —— 否则 CI-only 失败（locale / 时区 / 文件序）只剩控制台文本
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
